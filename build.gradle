plugins {
	id 'java'
}

repositories {
	mavenCentral()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(27)
	}
}

configurations {
	javaflowAgent
}

dependencies {
	implementation 'net.tascalate.javaflow:net.tascalate.javaflow.api:2.9.0'
	javaflowAgent('net.tascalate.javaflow:net.tascalate.javaflow.agent.core:2.9.0:shaded') { transitive = false }
	implementation 'net.sf.json-lib:json-lib:2.4:jdk15'
	implementation 'org.prefuse:prefuse:beta-20071021'
	implementation 'com.miglayout:miglayout-swing:11.5.2'
	testImplementation 'junit:junit:4.13.2'
}

sourceSets {
	main {
		java {
			srcDir 'src'
		}
	}

	examples {
		java {
			srcDir 'src'
			srcDir 'examples/node_scripts'
		}
	}

	test {
		java {
			srcDir 'test/src'
			srcDir 'test/node_scripts'
			exclude '**BadClass**'
		}
	}
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {
		attributes 'Main-Class': 'net.alexheavens.cs4099.ui.MainView'
	}

	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
}

// The compiler is the Java linter. The excluded categories hold known debt: java.util.Observable/Observer
// (deprecated), `new Integer(...)` and AccessController (marked for removal), prefuse's raw iterators
// (unchecked), and warnings that JDK 27 added (serial fields of Swing subclasses, `this` escaping a
// constructor, and 200 stray doc comments in the tests). Every other category fails the build.
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:all,-deprecation,-removal,-serial,-this-escape,-dangling-doc-comments,-unchecked' << '-Werror'
}

// The scheduler's continuations need the Tascalate agent to instrument the node classes (ADR 0001).
tasks.withType(Test).configureEach {
	doFirst {
		jvmArgs "-javaagent:${configurations.javaflowAgent.singleFile}"
	}
}
