name: CI

# Lints the workflows and shell scripts, then builds the project and runs its
# tests. The Java compiler is the Java linter: build.gradle turns its warnings
# into errors.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on the runner image.
      - name: Lint shell scripts
        run: shellcheck .githooks/pre-commit scripts/*.sh gradlew

  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        run: ./scripts/lint-workflows.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle

      - name: Pull the sandbox image
        run: scripts/pull-sandbox-image.sh

      - name: Build, lint and test
        run: ./gradlew build --console=plain

      # CircleCI's test job kept the results; this also fails a build whose tests silently vanished.
      - name: Count tests
        run: |
          count=$(cat build/test-results/test/*.xml | grep -c '<testcase ' || true)
          echo "tests run: $count"
          test "$count" -gt 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/test-results/
